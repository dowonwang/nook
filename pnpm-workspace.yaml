reporter: append-only

packages:
  - apps/server/*
  - apps/web/*
  - packages/*

allowBuilds:
  prisma: true
  '@prisma/engines': true
  bcrypt: false
  esbuild: false
  unrs-resolver: false

catalog:
  zod: 4.6.7
  prettier: 3.10.1

catalogs:
  node26:
    '@types/node': 26.6.6
  typescript5:
    typescript: 5.9.3
    tsx: 4.23.15
  backend1:
    bun-types: 1.4.4
    elysia: 1.4.32
    dotenv: 17.4.2
  prisma7:
    prisma: 7.10.1
    '@prisma/adapter-pg': 7.10.1
    '@prisma/client': 7.10.1
  postgres8:
    '@types/pg': 8.23.1
    'pg': 8.23.1
  next16:
    '@types/react': 19.3.0
    '@types/react-dom': 19.3.0
    next: 16.4.6
    react: 19.3.1
    react-dom: 19.3.1
    '@tanstack/react-query': 5.108.0
  eslint:
    '@eslint/js': 10.0.1
    '@next/eslint-plugin-next': 16.4.6
    eslint: 10.15.0
    eslint-import-resolver-typescript: 4.4.5
    eslint-plugin-import-x: 4.18.1
    eslint-plugin-react-hooks: 7.1.1
    typescript-eslint: 8.73.0
  ui:
    lucide-react: 1.75.0
    clsx: 2.1.1
    tailwind-merge: 3.7.0
    tailwindcss: 4.3.5
    '@tailwindcss/postcss': 4.3.5
  i18n:
    i18next: 26.7.2
    i18next-resources-to-backend: 1.2.4
    next-i18next: 16.4.11
    react-i18next: 17.1.13

overrides:
  '@types/node': 'catalog:node26'
